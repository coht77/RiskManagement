_schema-version: 3.3.0
ID: RiskManagement
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm run build

modules:
  - name: RiskManagement-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: RiskManagement-auth
      - name: RiskManagement-db
      - name: RiskManagement-destination

  - name: RiskManagement-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: RiskManagement-db

  - name: RiskManagement-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: RiskManagementriskmgn
          artifacts:
            - riskmgn.zip
          target-path: app/
    requires:
      - name: RiskManagement-auth
      - name: srv-api
      - name: RiskManagement-html5-repo-host
        parameters:
          content-target: true

  - name: RiskManagementriskmgn
    type: html5
    path: app/riskmgn
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

resources:
  - name: RiskManagement-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: RiskManagement-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'RiskViewer (RiskManagement ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.RiskViewer'
          - name: 'RiskManager (RiskManagement ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.RiskManager'

  - name: RiskManagement-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: RiskManagement-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
        init_data:
          instance:
            destinations:
              - Name: RiskManagement-srv-api
                Description: CAP backend service
                URL: '~{srv-api/srv-url}'
                Authentication: NoAuthentication
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
            existing_destinations_policy: update
    requires:
      - name: srv-api

  - name: RiskManagement-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      config:
        credential-type: binding-secret
